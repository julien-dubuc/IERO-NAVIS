<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IERO NAVIS — The boats of Hyères and of tomorrow</title>
<meta name="description" content="IERO NAVIS, the boats of Hyères and of tomorrow: three models, Orion, Calipso and Poséidon.">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ink:#111214; --ink-soft:#4a4d52; --line:#d9dbde; --paper:#ffffff; --mist:#f4f5f6; --sea:#2b3f4d;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.65;-webkit-font-smoothing:antialiased}
  img,video{display:block;max-width:100%}
  a{color:inherit}
  .wrap{width:min(1120px,100% - 48px);margin-inline:auto}

  /* Navigation */
  .nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(20px,4vw,56px);transition:background .4s,box-shadow .4s,padding .4s}
  .nav.scrolled{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line);padding-block:8px}
  .nav .brand img{height:44px;width:auto;opacity:0;transition:opacity .4s}
  .nav.scrolled .brand img{opacity:1}
  .nav ul{display:flex;gap:clamp(12px,2vw,30px);list-style:none}
  .nav ul a{text-decoration:none;font-size:.74rem;letter-spacing:.15em;text-transform:uppercase;position:relative;padding-block:6px;white-space:nowrap}
  .nav ul a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
  .nav ul a:hover::after,.nav ul a[aria-current="page"]::after{transform:scaleX(1)}
  .lang{display:flex;border:1px solid var(--line);background:rgba(255,255,255,.75)}
  .lang button{background:none;border:0;padding:6px 11px;font:inherit;font-size:.72rem;letter-spacing:.14em;cursor:pointer;color:var(--ink)}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* Génériques */
  section{position:relative}
  .eyebrow{font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
  h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.15}
  h2{font-size:clamp(2rem,4.4vw,3.2rem);margin-top:14px}
  .lead{max-width:640px;margin-top:22px;color:var(--ink-soft);font-size:1.06rem}
  .pad{padding-block:clamp(72px,11vw,140px)}
  .reveal{opacity:0;transform:translateY(26px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  .btn{display:inline-block;margin-top:30px;padding:15px 34px;border:1px solid var(--ink);text-decoration:none;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;transition:background .35s,color .35s}
  .btn:hover{background:var(--ink);color:#fff}
  footer{padding:36px 0 44px;text-align:center;font-size:.76rem;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  footer img{height:48px;width:auto;margin:0 auto 14px;opacity:.85}
  footer .links{margin-bottom:14px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
  footer .links a{text-decoration:none;border-bottom:1px solid transparent}
  footer .links a:hover{border-color:currentColor}

  /* Pages secondaires */
  .page-head{padding:clamp(130px,16vw,190px) 0 clamp(40px,6vw,70px);text-align:center;background:linear-gradient(var(--mist),var(--paper))}
  .page-head h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-top:14px}
  .page-head .lead{margin-inline:auto}

  /* Hero */
  .hero{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:var(--mist);text-align:center}
  .hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at center,rgba(255,255,255,.82) 0%,rgba(255,255,255,.55) 55%,rgba(255,255,255,.25) 100%)}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;z-index:2;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--paper))}
  .hero-inner{position:relative;z-index:3;padding:120px 24px 150px}
  .hero-inner img{width:min(760px,86vw);height:auto;margin-inline:auto}
  .hero-inner p{margin-top:12px;font-size:clamp(.85rem,1.4vw,1rem);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)}
  .hero .btn{margin-top:26px;background:rgba(255,255,255,.85)}
  .hero .btn:hover{background:var(--ink)}
  .scroll-hint{position:absolute;z-index:3;left:50%;bottom:28px;translate:-50% 0;width:1px;height:54px;background:linear-gradient(var(--ink),transparent);animation:hint 2.4s ease-in-out infinite}
  @keyframes hint{0%,100%{transform:scaleY(.4);transform-origin:top;opacity:.5}50%{transform:scaleY(1);opacity:1}}

  /* Présentation */
  .about{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(32px,6vw,96px);align-items:center}
  .about .visual{position:relative;aspect-ratio:4/3}
  .about .visual img{width:100%;height:100%;object-fit:cover;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 45%,transparent 100%);mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 45%,transparent 100%)}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;border-top:1px solid var(--line);padding-top:28px}
  .facts strong{display:block;font-family:Georgia,serif;font-weight:400;font-size:2.2rem;line-height:1}
  .facts span{display:block;margin-top:8px;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  .textlink{display:inline-block;margin-top:28px;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:3px}

  /* Gamme */
  .range-head{text-align:center;margin-bottom:clamp(40px,6vw,80px)}
  .range-head .lead{margin-inline:auto}
  .boat{position:relative;padding-block:clamp(56px,8vw,110px);overflow:hidden}
  .boat.alt{background:var(--mist)}
  .boat .bg{position:absolute;inset:0;z-index:0;pointer-events:none}
  .boat .bg img{position:absolute;top:0;height:100%;width:62%;object-fit:cover;opacity:0;transition:opacity 1.4s ease}
  .boat .bg img.on{opacity:1}
  .boat.left .bg img{left:0;-webkit-mask-image:linear-gradient(to right,#000 30%,transparent 100%),linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,#000 30%,transparent 100%),linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);mask-composite:intersect}
  .boat.right .bg img{right:0;-webkit-mask-image:linear-gradient(to left,#000 30%,transparent 100%),linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to left,#000 30%,transparent 100%),linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);mask-composite:intersect}
  .boat .content{position:relative;z-index:1;min-height:clamp(420px,52vw,600px);display:flex;align-items:center}
  .boat.left .content{justify-content:flex-end}
  .boat.right .content{justify-content:flex-start}
  .card{width:min(470px,100%);background:rgba(255,255,255,.88);backdrop-filter:blur(6px);padding:clamp(28px,4vw,48px);border:1px solid rgba(217,219,222,.7)}
  .boat.alt .card{background:rgba(255,255,255,.9)}
  .tag{display:inline-flex;align-items:center;gap:12px;font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
  .tag b{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--ink);font-family:Georgia,serif;font-weight:400;font-size:1.05rem;letter-spacing:0;color:var(--ink)}
  .card h3{font-family:Georgia,serif;font-weight:400;font-size:clamp(1.7rem,3vw,2.2rem);margin-top:16px;line-height:1.2}
  .card p{margin-top:14px;color:var(--ink-soft)}
  .card ul{list-style:none;margin-top:20px;border-top:1px solid var(--line)}
  .card li{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
  .card li span:first-child{color:var(--ink-soft)}
  .card li span:last-child{text-align:right}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  .thumbs button{width:58px;height:40px;padding:0;border:1px solid var(--line);background:none;cursor:pointer;overflow:hidden;opacity:.55;transition:opacity .3s,border-color .3s}
  .thumbs button:hover,.thumbs button.on{opacity:1;border-color:var(--ink)}
  .thumbs img{width:100%;height:100%;object-fit:cover}

  /* Savoir-faire */
  .craft{background:var(--sea);color:#fff;overflow:hidden}
  .craft .bg{position:absolute;inset:0;z-index:0}
  .craft .bg img{width:100%;height:100%;object-fit:cover;opacity:.28;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 75%,transparent)}
  .craft .wrap{position:relative;z-index:1}
  .craft .eyebrow,.craft .lead{color:rgba(255,255,255,.72)}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,48px);margin-top:56px}
  .step{border-top:1px solid rgba(255,255,255,.35);padding-top:22px}
  .step small{font-size:.74rem;letter-spacing:.24em;color:rgba(255,255,255,.6)}
  .step h4{font-family:Georgia,serif;font-weight:400;font-size:1.45rem;margin-top:10px}
  .step p{margin-top:10px;color:rgba(255,255,255,.76);font-size:.97rem}

  /* Équipe */
  .team .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.6vw,20px);margin-top:44px}
  .team .trio img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--mist)}
  @media (max-width:860px){.team .trio{grid-template-columns:1fr}}

  /* Tarifs / contact */
  .tarifs{text-align:center}
  .contact{background:var(--mist)}
  .contact .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:clamp(24px,5vw,80px);margin-top:44px}
  .contact .item{border-top:1px solid var(--ink);padding-top:20px}
  .contact .item small{display:block;font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
  .contact .item a{display:inline-block;margin-top:10px;font-family:Georgia,serif;font-size:clamp(1.3rem,2.6vw,1.9rem);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .3s}
  .contact .item a:hover{border-color:var(--ink)}

  @media (max-width:860px){
    .about{grid-template-columns:1fr}
    .boat .bg img{width:100%}
    .boat .bg img.on{opacity:.45}
    .boat.left .bg img,.boat.right .bg img{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 75%,transparent);-webkit-mask-composite:source-over;mask-composite:add}
    .boat.left .content,.boat.right .content{justify-content:center}
    .steps{grid-template-columns:1fr}
    .contact .grid{grid-template-columns:1fr}
  }
  @media (max-width:520px){.facts{gap:10px}.facts strong{font-size:1.7rem}}

  @media (max-width:980px){
    .nav{flex-wrap:wrap;justify-content:center;row-gap:6px}
    .nav .brand{display:none}
    .nav ul{flex-wrap:wrap;justify-content:center;gap:4px 14px}
    .nav ul a{font-size:.68rem;letter-spacing:.1em}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>

<header class="nav" id="nav">

<!-- Home -->
<section class="hero" id="accueil">
  <video autoplay muted loop playsinline preload="metadata" poster="calipso-3.webp">
    <source src="video-accueil.mp4" type="video/mp4">
  </video>
  <div class="hero-inner">
    <img src="logo-iero-navis.png" alt="IERO NAVIS">
    <p data-i18n="hero.motto"></p>
    <a class="btn" data-link="video.html" href="video.html" data-i18n="hero.film"></a>
  </div>

</section>

<!-- Company -->
<section class="pad" id="entreprise">

<section id="gamme">

      <img class="on" src="calipso-1.webp" alt="">
      <img src="calipso-2.webp" alt="">
      <img src="calipso-3.webp" alt="">
      <img src="calipso-4.webp" alt="">
      <img src="calipso-5.webp" alt="">
    </div>
    <div class="wrap content">
      <div class="card reveal">
        <span class="tag"><b>B</b><span data-i18n="b.tag"></span></span>
        <h3>Calipso</h3>
        <p data-i18n="b.p"></p>
        <ul>
          <li><span data-i18n="l.length"></span><span data-i18n="b.length"></span></li>
          <li><span data-i18n="l.weight"></span><span data-i18n="b.weight"></span></li>
          <li><span data-i18n="l.equip"></span><span data-i18n="b.equip"></span></li>

  <!-- Poséidon -->

      <img src="poseidon-2.webp" alt="" style="object-position:center 45%">
      <img src="poseidon-3.webp" alt="" style="object-position:center 45%">
    </div>
    <div class="wrap content">
      <div class="card reveal">
        <span class="tag"><b>C</b><span data-i18n="c.tag"></span></span>
        <h3>Poséidon</h3>

  /* ---- Langue EN / FR ---- */
  const LANGS = ['en','fr'];
  function currentLang(){
    const p = new URLSearchParams(location.search).get('lang');
    if (LANGS.includes(p)) return p;
    try { const s = localStorage.getItem('iero-lang'); if (LANGS.includes(s)) return s; } catch(e){}
    return 'en';
  }
  function applyLang(l){
    const d = Object.assign({}, I18N[l]);
    document.documentElement.lang = l;
    if (d.title) document.title = d.title;
    document.querySelectorAll('[data-i18n]').forEach(el => { const v = d[el.dataset.i18n]; if (v !== undefined) el.innerHTML = v; });
    document.querySelectorAll('[data-i18n-attr]').forEach(el => {
      el.dataset.i18nAttr.split(';').forEach(pair => { const [attr,key] = pair.split(':'); if (d[key] !== undefined) el.setAttribute(attr, d[key]); });
    });
    document.querySelectorAll('[data-link]').forEach(a => {
      const [page, hash] = a.dataset.link.split('#');
      a.setAttribute('href', (page || '') + '?lang=' + l + (hash ? '#' + hash : ''));
      if (!page) a.setAttribute('href', '#' + hash);
    });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
    document.dispatchEvent(new CustomEvent('langchange', {detail:l}));
  }
  function setLang(l){
    try { localStorage.setItem('iero-lang', l); } catch(e){}
    try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u); } catch(e){}
    applyLang(l);
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  applyLang(currentLang());

  /* ---- Barre de navigation ---- */
  const nav = document.getElementById('nav');
  if (nav && !nav.classList.contains('scrolled')) {
    const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > window.innerHeight * 0.6);
    addEventListener('scroll', onScroll, {passive:true}); onScroll();
  }

  /* ---- Apparition en fondu ---- */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }), {threshold:.12});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));


  /* ---- Galeries de la gamme : vignettes + fondu d'arrière-plan ---- */
  document.querySelectorAll('[data-gallery]').forEach(boat => {
    const imgs = [...boat.querySelectorAll('.bg img')];
    const thumbs = boat.querySelector('.thumbs');
    const buttons = imgs.map((img, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.setAttribute('aria-label', 'Photo ' + (i + 1));
      const t = document.createElement('img'); t.src = img.src; t.alt = ''; t.loading = 'lazy';
      b.appendChild(t); b.addEventListener('click', () => show(i)); thumbs.appendChild(b);
      return b;
    });
    let current = 0, timer;
    function show(i){
      current = i;
      imgs.forEach((im, k) => im.classList.toggle('on', k === i));
      buttons.forEach((b, k) => b.classList.toggle('on', k === i));
      clearInterval(timer); timer = setInterval(() => show((current + 1) % imgs.length), 6500);
    }
    show(0);
  });
