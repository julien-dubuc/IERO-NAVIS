<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing sheets — IERO NAVIS</title>

<style>
  :root{
    --ink:#111214; --ink-soft:#4a4d52; --line:#d9dbde; --paper:#ffffff; --mist:#f4f5f6; --sea:#2b3f4d;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.65;-webkit-font-smoothing:antialiased}
  img,video{display:block;max-width:100%}
  a{color:inherit}
  .wrap{width:min(1120px,100% - 48px);margin-inline:auto}

  /* Navigation */
  .nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(20px,4vw,56px);transition:background .4s,box-shadow .4s,padding .4s}
  .nav.scrolled{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line);padding-block:8px}
  .nav .brand img{height:44px;width:auto;opacity:0;transition:opacity .4s}
  .nav.scrolled .brand img{opacity:1}
  .nav ul{display:flex;gap:clamp(12px,2vw,30px);list-style:none}
  .nav ul a{text-decoration:none;font-size:.74rem;letter-spacing:.15em;text-transform:uppercase;position:relative;padding-block:6px;white-space:nowrap}
  .nav ul a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
  .nav ul a:hover::after,.nav ul a[aria-current="page"]::after{transform:scaleX(1)}
  .lang{display:flex;border:1px solid var(--line);background:rgba(255,255,255,.75)}
  .lang button{background:none;border:0;padding:6px 11px;font:inherit;font-size:.72rem;letter-spacing:.14em;cursor:pointer;color:var(--ink)}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* Génériques */
  section{position:relative}
  .eyebrow{font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
  h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.15}
  h2{font-size:clamp(2rem,4.4vw,3.2rem);margin-top:14px}
  .lead{max-width:640px;margin-top:22px;color:var(--ink-soft);font-size:1.06rem}
  .pad{padding-block:clamp(72px,11vw,140px)}
  .reveal{opacity:0;transform:translateY(26px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  .btn{display:inline-block;margin-top:30px;padding:15px 34px;border:1px solid var(--ink);text-decoration:none;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;transition:background .35s,color .35s}
  .btn:hover{background:var(--ink);color:#fff}
  footer{padding:36px 0 44px;text-align:center;font-size:.76rem;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  footer img{height:48px;width:auto;margin:0 auto 14px;opacity:.85}
  footer .links{margin-bottom:14px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
  footer .links a{text-decoration:none;border-bottom:1px solid transparent}
  footer .links a:hover{border-color:currentColor}

  /* Pages secondaires */
  .page-head{padding:clamp(130px,16vw,190px) 0 clamp(40px,6vw,70px);text-align:center;background:linear-gradient(var(--mist),var(--paper))}
  .page-head h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-top:14px}
  .page-head .lead{margin-inline:auto}

  .filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:clamp(28px,4vw,48px)}
  .filters button{background:none;border:1px solid var(--line);padding:9px 20px;font:inherit;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
  .filters button:hover{border-color:var(--ink)}
  .filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grid{columns:3 280px;column-gap:16px}
  .shot{break-inside:avoid;margin-bottom:16px;position:relative;cursor:zoom-in;overflow:hidden;background:var(--mist);border:0;padding:0;display:block;width:100%}
  .shot img{width:100%;height:auto;transition:transform .8s var(--ease),opacity .6s;opacity:0}
  .shot img.loaded{opacity:1}
  .shot:hover img{transform:scale(1.04)}
  .shot span{position:absolute;left:0;bottom:0;padding:18px 16px 12px;width:100%;color:#fff;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:opacity .4s}
  .shot:hover span{opacity:1}
  .shot[hidden]{display:none}
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,12,14,.92);display:none;align-items:center;justify-content:center;padding:24px}
  .lightbox.open{display:flex}
  .lightbox img{max-height:86vh;max-width:min(1200px,92vw);width:auto;height:auto;box-shadow:0 10px 60px rgba(0,0,0,.5)}
  .lightbox button{position:absolute;background:none;border:0;color:#fff;font-size:2.4rem;line-height:1;cursor:pointer;padding:14px;opacity:.8}
  .lightbox button:hover{opacity:1}
  .lightbox .close{top:10px;right:16px}
  .lightbox .prev{left:8px;top:50%;translate:0 -50%}
  .lightbox .next{right:8px;top:50%;translate:0 -50%}
  .lightbox .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:.76rem;letter-spacing:.2em;text-transform:uppercase}

  .grid{columns:3 240px}
  .shot{cursor:zoom-in}
  .shot img{aspect-ratio:210/297;object-fit:cover;object-position:top;box-shadow:0 2px 14px rgba(0,0,0,.08)}
  .affiche{margin:0 auto 34px;width:min(100%,340px)}
  .affiche img{width:100%;height:auto;display:block;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .dl{display:flex;justify-content:center;margin-bottom:34px}
  .dl .btn{margin-top:0}
  .lightbox img{max-width:min(900px,94vw)}

  @media (max-width:980px){
    .nav{flex-wrap:wrap;justify-content:center;row-gap:6px}
    .nav .brand{display:none}
    .nav ul{flex-wrap:wrap;justify-content:center;gap:4px 14px}
    .nav ul a{font-size:.68rem;letter-spacing:.1em}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>

<script>
  const I18N = {
 "en": {
  "nav.company": "Company",
  "nav.range": "Range",
  "nav.craft": "Know-how",
  "nav.events": "Events",
  "nav.press": "Press",
  "nav.gallery": "Gallery",
  "nav.film": "Film",
  "nav.mkt": "Marketing",
  "nav.pres": "Presentation",
  "nav.sav": "After-sales",
  "nav.contact": "Contact",
  "foot.rights": "All rights reserved",
  "foot.philosophy": "Philosophy &amp; values",
  "foot.home": "Home",
  "title": "Marketing sheets — IERO NAVIS",
  "meta": "The IERO NAVIS marketing sheets: strategy, pricing, distribution and advertising.",
  "m.aff": "The IERO NAVIS Calipso poster",
  "m.eyebrow": "Marketing",
  "m.h1": "Our marketing sheets",
  "m.lead": "Positioning, segmentation, pricing, distribution and advertising: how IERO NAVIS takes Orion, Calipso and Poséidon to market.",
  "m.pdf": "Download all the sheets (PDF)",
  "m.strategy": "Strategy",
  "m.distribution": "Pricing &amp; distribution",
  "m.advertising": "Advertising",
  "g.all": "All",
  "g.close": "Close",
  "g.prev": "Previous page",
  "g.next": "Next page"
 },
 "fr": {
  "nav.company": "Entreprise",
  "nav.range": "Gamme",
  "nav.craft": "Savoir-faire",
  "nav.events": "Événements",
  "nav.press": "Presse",
  "nav.gallery": "Galerie",
  "nav.film": "Film",
  "nav.mkt": "Marketing",
  "nav.pres": "Présentation",
  "nav.sav": "SAV",
  "nav.contact": "Contact",
  "foot.rights": "Tous droits réservés",
  "foot.philosophy": "Philosophie &amp; valeurs",
  "foot.home": "Accueil",
  "title": "Fiches marketing — IERO NAVIS",
  "meta": "Les fiches marketing IERO NAVIS : stratégie, prix, distribution et publicité.",
  "m.aff": "L’affiche Calipso d’IERO NAVIS",
  "m.eyebrow": "Marketing",
  "m.h1": "Nos fiches marketing",
  "m.lead": "Positionnement, segmentation, prix, distribution et publicité : comment IERO NAVIS met Orion, Calipso et Poséidon sur le marché.",
  "m.pdf": "Télécharger toutes les fiches (PDF)",
  "m.strategy": "Stratégie",
  "m.distribution": "Prix &amp; distribution",
  "m.advertising": "Publicité",
  "g.all": "Toutes",
  "g.close": "Fermer",
  "g.prev": "Page précédente",
  "g.next": "Page suivante"
 }
};

  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---- Langue EN / FR ---- */
  const LANGS = ['en','fr'];
  function currentLang(){
    const p = new URLSearchParams(location.search).get('lang');
    if (LANGS.includes(p)) return p;
    try { const s = localStorage.getItem('iero-lang'); if (LANGS.includes(s)) return s; } catch(e){}
    return 'en';
  }
  function applyLang(l){
    const d = Object.assign({}, I18N[l]);
    document.documentElement.lang = l;
    if (d.title) document.title = d.title;
    document.querySelectorAll('[data-i18n]').forEach(el => { const v = d[el.dataset.i18n]; if (v !== undefined) el.innerHTML = v; });
    document.querySelectorAll('[data-i18n-attr]').forEach(el => {
      el.dataset.i18nAttr.split(';').forEach(pair => { const [attr,key] = pair.split(':'); if (d[key] !== undefined) el.setAttribute(attr, d[key]); });
    });
    document.querySelectorAll('[data-link]').forEach(a => {
      const [page, hash] = a.dataset.link.split('#');
      a.setAttribute('href', (page || '') + '?lang=' + l + (hash ? '#' + hash : ''));
      if (!page) a.setAttribute('href', '#' + hash);
    });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
    document.dispatchEvent(new CustomEvent('langchange', {detail:l}));
  }
  function setLang(l){
    try { localStorage.setItem('iero-lang', l); } catch(e){}
    try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u); } catch(e){}
    applyLang(l);
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  applyLang(currentLang());

  /* ---- Barre de navigation ---- */
  const nav = document.getElementById('nav');
  if (nav && !nav.classList.contains('scrolled')) {
    const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > window.innerHeight * 0.6);
    addEventListener('scroll', onScroll, {passive:true}); onScroll();
  }

  /* ---- Apparition en fondu ---- */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }), {threshold:.12});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));


  /* ---- Galerie : filtres + visionneuse ---- */
  const shotsEls = [...document.querySelectorAll('.shot')];
  shotsEls.forEach(s => { const im = s.querySelector('img'); if (im.complete) im.classList.add('loaded'); else im.addEventListener('load', () => im.classList.add('loaded')); });
  document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    shotsEls.forEach(s => { s.hidden = !(b.dataset.filter === 'all' || s.dataset.model === b.dataset.filter); });
  }));
  const lb = document.getElementById('lightbox'), lbimg = document.getElementById('lbimg'), lbcap = document.getElementById('lbcap');
  let idx = 0;
  const visible = () => shotsEls.filter(s => !s.hidden);
  function open(i){
    const list = visible(); idx = (i + list.length) % list.length;
    const im = list[idx].querySelector('img');
    lbimg.src = im.src; lbimg.alt = im.alt; lbcap.textContent = im.alt + '  ·  ' + (idx + 1) + ' / ' + list.length;
    lb.classList.add('open');
  }
  shotsEls.forEach(s => s.addEventListener('click', () => open(visible().indexOf(s))));
  lb.querySelector('.close').addEventListener('click', () => lb.classList.remove('open'));
  lb.querySelector('.prev').addEventListener('click', () => open(idx - 1));
  lb.querySelector('.next').addEventListener('click', () => open(idx + 1));
  lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });
  addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowLeft') open(idx - 1);
    if (e.key === 'ArrowRight') open(idx + 1);
  });

</script>
</body>
</html>
