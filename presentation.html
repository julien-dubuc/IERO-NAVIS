<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oral presentation — IERO NAVIS</title>
<meta name="description" content="Oral presentation of IERO NAVIS: brand, target audience, strengths, strategy and social media results.">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ink:#111214; --ink-soft:#4a4d52; --line:#d9dbde; --paper:#ffffff; --mist:#f4f5f6; --sea:#2b3f4d;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.65;-webkit-font-smoothing:antialiased}
  img,video{display:block;max-width:100%}
  a{color:inherit}
  .wrap{width:min(1120px,100% - 48px);margin-inline:auto}

  /* Navigation */
  .nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(20px,4vw,56px);transition:background .4s,box-shadow .4s,padding .4s}
  .nav.scrolled{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line);padding-block:8px}
  .nav .brand img{height:44px;width:auto;opacity:0;transition:opacity .4s}
  .nav.scrolled .brand img{opacity:1}
  .nav ul{display:flex;gap:clamp(12px,2vw,30px);list-style:none}
  .nav ul a{text-decoration:none;font-size:.74rem;letter-spacing:.15em;text-transform:uppercase;position:relative;padding-block:6px;white-space:nowrap}
  .nav ul a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
  .nav ul a:hover::after,.nav ul a[aria-current="page"]::after{transform:scaleX(1)}
  .lang{display:flex;border:1px solid var(--line);background:rgba(255,255,255,.75)}
  .lang button{background:none;border:0;padding:6px 11px;font:inherit;font-size:.72rem;letter-spacing:.14em;cursor:pointer;color:var(--ink)}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* Génériques */
  section{position:relative}
  .eyebrow{font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
  h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.15}
  h2{font-size:clamp(2rem,4.4vw,3.2rem);margin-top:14px}
  .lead{max-width:640px;margin-top:22px;color:var(--ink-soft);font-size:1.06rem}
  .pad{padding-block:clamp(72px,11vw,140px)}
  .reveal{opacity:0;transform:translateY(26px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  .btn{display:inline-block;margin-top:30px;padding:15px 34px;border:1px solid var(--ink);text-decoration:none;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;transition:background .35s,color .35s}
  .btn:hover{background:var(--ink);color:#fff}
  footer{padding:36px 0 44px;text-align:center;font-size:.76rem;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  footer img{height:48px;width:auto;margin:0 auto 14px;opacity:.85}
  footer .links{margin-bottom:14px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
  footer .links a{text-decoration:none;border-bottom:1px solid transparent}
  footer .links a:hover{border-color:currentColor}

  /* Pages secondaires */
  .page-head{padding:clamp(130px,16vw,190px) 0 clamp(40px,6vw,70px);text-align:center;background:linear-gradient(var(--mist),var(--paper))}
  .page-head h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-top:14px}
  .page-head .lead{margin-inline:auto}

  .slide-sec{padding-block:clamp(48px,7vw,90px);border-top:1px solid var(--line)}
  .slide-sec:first-of-type{border-top:0}
  .slide-no{font-family:Georgia,serif;font-size:clamp(2.6rem,6vw,4.4rem);color:var(--line);line-height:1}
  .slide-sec h2{margin-top:6px}
  .pblocks{display:grid;gap:clamp(28px,4vw,52px);margin-top:clamp(32px,4vw,52px)}
  .pb{display:grid;grid-template-columns:clamp(150px,22vw,230px) 1fr;gap:clamp(18px,3vw,40px);align-items:start;border-top:1px solid var(--ink);padding-top:22px}
  .pb.noimg{grid-template-columns:1fr}
  .pb a.thumb{display:block;box-shadow:0 2px 16px rgba(0,0,0,.12);background:var(--mist)}
  .pb a.thumb img{width:100%;height:auto;display:block}
  .pb h3{font-family:Georgia,serif;font-weight:400;font-size:clamp(1.3rem,2.4vw,1.7rem)}
  .pb p,.pb .pt{margin-top:10px;color:var(--ink-soft)}
  .pb .pt{font-size:1.02rem}
  .pb .pt b{color:var(--ink);font-weight:600}
  .pb p.why{color:var(--ink)}
  .pb p.why b{font-weight:600;letter-spacing:.04em}
  .pb ul{margin:0 0 0 1.1em}
  .pb li{margin-top:6px}
  .retro{margin-top:clamp(28px,4vw,48px)}
  .retro-t{font-family:Georgia,serif;font-weight:400;font-size:clamp(1.6rem,3.2vw,2.3rem)}
  .proj{margin-top:clamp(30px,4.4vw,52px)}
  .proj-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,3.4vw,44px);margin-top:18px}
  .proj-col{border-top:1px solid var(--ink);padding-top:18px}
  .proj-col h4{font-family:Georgia,serif;font-size:clamp(1.25rem,2.4vw,1.6rem);font-weight:400;color:var(--ink)}
  .proj-col .pt{margin-top:12px;color:var(--ink-soft)}
  .proj-col ul{margin:0 0 0 1.1em}
  .proj-col li{margin-top:6px}
  .proj-col b{color:var(--ink);font-weight:600}
  @media (max-width:760px){.proj-grid{grid-template-columns:1fr}}
  .retro-sub{margin-top:clamp(26px,4vw,44px);border-top:1px solid var(--ink);padding-top:20px}
  .retro-sub h4{font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;font-weight:400;color:var(--ink-soft)}
  .fin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(20px,4vw,56px);margin-top:20px;align-items:start}
  .chart{margin:0}
  .chart figcaption{font-size:.84rem;color:var(--ink-soft)}
  .bars{display:flex;align-items:flex-end;justify-content:center;gap:clamp(24px,6vw,64px);height:260px;margin-top:34px;border-bottom:1px solid var(--ink)}
  .bars .col{position:relative;width:clamp(70px,14vw,120px);height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
  .bars .bar{background:var(--line);width:100%;min-height:4px}
  .bars .bar.hi{background:var(--ink)}
  .bars .val{text-align:center;font-family:Georgia,serif;font-size:1.25rem;padding-bottom:6px}
  .bars b{position:absolute;left:0;right:0;top:calc(100% + 8px);text-align:center;font-weight:400;letter-spacing:.16em}
  .bars small{position:absolute;left:-20%;right:-20%;top:calc(100% + 32px);text-align:center;color:var(--ink-soft);font-size:.82rem}
  .chart .mult{margin-top:74px;text-align:center;font-size:.9rem;color:var(--ink-soft)}
  .cards{display:grid;gap:clamp(14px,2.4vw,26px)}
  .cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards .stat strong{font-size:clamp(1.9rem,4vw,2.9rem)}
  .hr{display:grid;grid-template-columns:clamp(150px,24vw,260px) minmax(0,1fr);gap:clamp(18px,3.4vw,44px);margin-top:20px;align-items:start}
  .hrfig{margin:0}
  .hrfig figcaption{margin-top:10px;font-style:italic;font-size:.88rem;color:var(--ink-soft)}
  .hr a.thumb{display:block;box-shadow:0 2px 16px rgba(0,0,0,.12);background:var(--mist)}
  .hr a.thumb img{width:100%;height:auto;display:block}
  @media (max-width:760px){.fin{grid-template-columns:1fr}.hr{grid-template-columns:1fr}.hr a.thumb{max-width:260px}}
  @media (max-width:420px){.cards.two{grid-template-columns:1fr}}
  .chip{display:inline-block;margin-top:10px;border:1px solid var(--line);padding:5px 12px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:clamp(16px,3vw,36px);margin-top:clamp(32px,4vw,52px)}
  .stat{border-top:1px solid var(--ink);padding-top:20px}
  .stat strong{display:block;font-family:Georgia,serif;font-weight:400;font-size:clamp(2.6rem,6vw,4.2rem);line-height:1.05}
  .stat span{display:block;margin-top:8px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
  .stat small{display:block;margin-top:6px;color:var(--ink-soft);font-size:.88rem}
  .pnote{margin-top:26px;color:var(--ink-soft);font-size:.92rem}
  @media (max-width:560px){.pb{grid-template-columns:1fr}.pb a.thumb{max-width:260px}}

  @media (max-width:980px){
    .nav{flex-wrap:wrap;justify-content:center;row-gap:6px}
    .nav .brand{display:none}
    .nav ul{flex-wrap:wrap;justify-content:center;gap:4px 14px}
    .nav ul a{font-size:.68rem;letter-spacing:.1em}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>

  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---- Langue EN / FR ---- */
  const LANGS = ['en','fr'];
  function currentLang(){
    const p = new URLSearchParams(location.search).get('lang');
    if (LANGS.includes(p)) return p;
    try { const s = localStorage.getItem('iero-lang'); if (LANGS.includes(s)) return s; } catch(e){}
    return 'en';
  }
  function applyLang(l){
    const d = Object.assign({}, I18N[l]);
    document.documentElement.lang = l;
    if (d.title) document.title = d.title;
    document.querySelectorAll('[data-i18n]').forEach(el => { const v = d[el.dataset.i18n]; if (v !== undefined) el.innerHTML = v; });
    document.querySelectorAll('[data-i18n-attr]').forEach(el => {
      el.dataset.i18nAttr.split(';').forEach(pair => { const [attr,key] = pair.split(':'); if (d[key] !== undefined) el.setAttribute(attr, d[key]); });
    });
    document.querySelectorAll('[data-link]').forEach(a => {
      const [page, hash] = a.dataset.link.split('#');
      a.setAttribute('href', (page || '') + '?lang=' + l + (hash ? '#' + hash : ''));
      if (!page) a.setAttribute('href', '#' + hash);
    });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
    document.dispatchEvent(new CustomEvent('langchange', {detail:l}));
  }
  function setLang(l){
    try { localStorage.setItem('iero-lang', l); } catch(e){}
    try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u); } catch(e){}
    applyLang(l);
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  applyLang(currentLang());

  /* ---- Barre de navigation ---- */
  const nav = document.getElementById('nav');
  if (nav && !nav.classList.contains('scrolled')) {
    const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > window.innerHeight * 0.6);
    addEventListener('scroll', onScroll, {passive:true}); onScroll();
  }

  /* ---- Apparition en fondu ---- */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }), {threshold:.12});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));


  /* Espaces entre milliers selon la langue */
  const raw = {'n-views':55476, 'n-fol':412, 'n-int':1590};
  function fmt(){ const loc = document.documentElement.lang === 'fr' ? 'fr-FR' : 'en-GB'; Object.keys(raw).forEach(id => { document.getElementById(id).textContent = raw[id].toLocaleString(loc); }); }
  document.addEventListener('langchange', fmt); fmt();
