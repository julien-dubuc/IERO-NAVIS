<style>
  :root{

  *{box-sizing:border-box;margin:0;padding:0}

  .nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(20px,4vw,56px);transition:background .4s,box-shadow .4s,padding .4s}

  .nav ul a{text-decoration:none;font-size:.74rem;letter-spacing:.15em;text-transform:uppercase;position:relative;padding-block:6px;white-space:nowrap}
  .nav ul a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}

  .lang{display:flex;border:1px solid var(--line);background:rgba(255,255,255,.75)}
  .lang button{background:none;border:0;padding:6px 11px;font:inherit;font-size:.72rem;letter-spacing:.14em;cursor:pointer;color:var(--ink)}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* Génériques */
  section{position:relative}
  .eyebrow{font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
  h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.15}
  h2{font-size:clamp(2rem,4.4vw,3.2rem);margin-top:14px}
  .lead{max-width:640px;margin-top:22px;color:var(--ink-soft);font-size:1.06rem}
  .pad{padding-block:clamp(72px,11vw,140px)}
  .reveal{opacity:0;transform:translateY(26px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  .btn{display:inline-block;margin-top:30px;padding:15px 34px;border:1px solid var(--ink);text-decoration:none;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;transition:background .35s,color .35s}
  .btn:hover{background:var(--ink);color:#fff}
  footer{padding:36px 0 44px;text-align:center;font-size:.76rem;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  footer img{height:48px;width:auto;margin:0 auto 14px;opacity:.85}
  footer .links{margin-bottom:14px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
  footer .links a{text-decoration:none;border-bottom:1px solid transparent}
  footer .links a:hover{border-color:currentColor}

  /* Pages secondaires */
  .page-head{padding:clamp(130px,16vw,190px) 0 clamp(40px,6vw,70px);text-align:center;background:linear-gradient(var(--mist),var(--paper))}
  .page-head h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-top:14px}
  .page-head .lead{margin-inline:auto}

  .articles{display:grid;gap:clamp(40px,6vw,72px)}
  .article{max-width:760px;margin-inline:auto;padding-bottom:clamp(40px,6vw,72px);border-bottom:1px solid var(--line)}
  .article:last-child{border-bottom:0}
  .article .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
  .article h2{font-size:clamp(1.6rem,3.2vw,2.3rem);margin-top:14px}
  .article p{margin-top:18px;color:var(--ink-soft)}
  .article p:first-of-type{color:var(--ink);font-size:1.08rem}
  .article .contactline{margin-top:24px;font-size:.84rem;color:var(--ink-soft)}
  .toc{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:32px}
  .toc a{border:1px solid var(--line);padding:8px 16px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;transition:background .3s,color .3s}
  .toc a:hover{background:var(--ink);color:#fff}

  @media (max-width:980px){
    .nav{flex-wrap:wrap;justify-content:center;row-gap:6px}
    .nav .brand{display:none}
    .nav ul{flex-wrap:wrap;justify-content:center;gap:4px 14px}
    .nav ul a{font-size:.68rem;letter-spacing:.1em}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>

  "a1.date": "12 October 2025",
  "a1.h": "IERO NAVIS introduces a three-model range for fishing and leisure boating",
  "a1.p1": "Hyères — IERO NAVIS today presents its new range of boats, named Orion, Calipso and Poséidon. Together they cover the main ways of using the water, from a simple fishing boat to a leisure cruiser for the open sea.",
  "a1.p2": "Orion, at 4 metres and 250 kg, is the entry point of the range: a stripped-back boat with a very shallow draught, suited to fishing and gentle outings. Calipso, at 5.50 metres, adds a two-berth cabin and a sun deck for longer trips on sea, lake, estuary or canal. Poséidon, at 8 metres, offers two cabins, a helm station and room for twin high-power engines.",
  "a1.p3": "“We wanted a range that is easy to understand: three boats, three uses, one standard of quality,” says the IERO NAVIS team. The boats are sold through retailers, who equip them with engines or masts according to their customers’ needs.",
  "a2.date": "3 November 2025",
  "a2.h": "Moulding and finishing: two fully robotised workshops in Hyères",
  "a2.p1": "Hyères — IERO NAVIS lifts the curtain on the way its boats are made. Every hull passes through two fully robotised workshops, one for moulding and one for finishing, both managed by computer.",
  "a2.p2": "In the first workshop, robots mould the plastic hulls. In the second, finishing robots add the wood and the fittings to the moulded hulls, so that the boat leaves the line as a finished product. This organisation gives each boat the same level of quality, whichever model is produced.",
  "a2.p3": "The company can also adjust its production from one quarter to the next, adding or pausing a model according to demand. Visitors will be able to see the workshops at the IERO NAVIS open days planned in Hyères in March 2026.",
  "a3.date": "17 November 2025",
  "a3.h": "IERO NAVIS to exhibit at Nautic – Paris Boat Show in December",
  "a3.p1": "Hyères — IERO NAVIS will take part in Nautic – Paris Boat Show in December 2026, its first appearance at a major national boating event.",
  "a3.p2": "Visitors will be able to discover Orion, Calipso and Poséidon in person, compare the three models and talk with the team about their design, materials and finish. Retailers and professionals are invited to meet us to discuss partnerships.",
  "a3.p3": "The show is the first stop in a series of events that will take the company from Hyères to Paris and the French Riviera in 2026. The full list is available on our events page.",
  "a6.short": "Cybersecurity",
  "a7.short": "Dialogue with staff",
  "a6.date": "1 October 2025",
  "a6.h": "Cybersecurity and data protection: IERO NAVIS reacts firmly and guarantees full continuity of its activities",
  "a6.p1": "Hyères — True to its motto “The boats of Hyères and of tomorrow”, IERO NAVIS confirms that it has recently detected and neutralised an attempted intrusion into its IT system, as well as illicit listening devices in shared business spaces.",
  "a6.p2": "As soon as these acts of industrial espionage were identified, the crisis unit isolated its networks as a precaution and launched a full security plan with the competent authorities. The company sticks strictly to the facts established by the ongoing judicial inquiry and will not comment on rumours about the origin of the attack.",
  "a6.p3": "Four measures protect our partners and our know-how: a new internal security policy (reinforced firewalls, full forensic audit, two-factor authentication, strict separation of sensitive data); physical security of the premises in Hyères; legal action, including a formal complaint and our industrial property rights registered with INPI; and industrial continuity, with the robotised workshops running at 100% capacity, all current orders honoured on time and no change to our prices.",
  "a7.date": "1 October 2026",
  "a7.h": "IERO NAVIS responds to criticism of working conditions for its administrative staff and opens dialogue",
  "a7.p1": "Hyères — IERO NAVIS has taken note of the public campaign on working conditions for administrative staff in the boating industry, and of a strike notice filed by a union. The company respects the right to strike and chooses dialogue.",
  "a7.p2": "The facts: the administrative department grew from 15 to 29 employees in one quarter, almost double; pay for the three categories of administrative staff has been raised; the company now has 41 employees, 12 of them sales representatives. Staff representatives and the union are received the next day, each administrative employee gets an individual meeting within 15 days, and every demand receives a written answer within 5 days. The company also offers to meet the association behind the campaign.",
  "a7.p3": "The premises suffered damage, and IERO NAVIS is carrying out a complete refit: asbestos and heavy-metal surveys, electrical and network repairs and a new office building, with remote working maintained and equipment provided during the works. Orders, deliveries and catalogue payment terms are maintained. “We almost doubled our administrative team in one quarter and raised pay. We listen to criticism and prefer dialogue to controversy,” says Julie Croize, marketing director and IERO NAVIS spokesperson.",
  "pr.pdf": "Download the full document (PDF)",
  "a4.short": "Gender parity",
  "a5.short": "Our press release",
  "a4.date": "20 November 2025",
  "a4.h": "Gender parity reached in the IERO NAVIS management team",
  "a4.p1": "Hyères — IERO NAVIS announces that gender parity has been reached in its management team: of the 11 people who make it up, 6 are women (55%) and 5 are men (45%), within the 40–60% range used by law for boards of directors.",
  "a4.p2": "Women lead the legal department, the finance department and the marketing department, and the finance team is perfectly balanced, with two women and two men. The company is continuing its efforts to make every team as mixed as possible, in particular the legal and marketing teams.",
  "a4.p3": "With 24 employees, IERO NAVIS is not required to publish a professional equality index. It has chosen to do so voluntarily, with an action plan covering recruitment, equal pay, promotions, work-life balance and the fight against sexism and harassment. The parity sheet is updated every quarter.",
  "a5.date": "26 November 2025",
  "a5.h": "IERO NAVIS announces measures for its employees and confirms continuity of service to its customers",
  "a5.p1": "Hyères — IERO NAVIS, a manufacturer of fishing and leisure boat hulls based in Hyères, recently suffered flooding and the collapse of retaining walls at its premises. The company is announcing a package of measures for its employees and confirming that its business continues for its customers.",
  "a5.p2": "The headquarters are inaccessible for several months of works; administrative and sales teams are working 100% remotely and the claim has been declared to the insurer. For employees: a flat-rate allowance per day worked from home and a meal compensation, an individual meeting on workload with defined contact hours, a listening unit and access to an alternative workplace, consultation of the works council and a remote-work amendment for the duration of the works. The CEO is meeting all staff within 48 hours, and no employee will be sanctioned for expressing disagreement.",
  "a5.p3": "For customers: orders, deliveries and the catalogue payment terms are maintained, and long-standing customers and distributors are being contacted individually. “We owe our employees clarity and the means to work in good conditions, and our customers continuity of service. We will keep both commitments,” says Bastien Coupeaux, CEO of IERO NAVIS."

  "a1.short": "La nouvelle gamme",

  "a1.date": "12 octobre 2025",
  "a1.h": "IERO NAVIS présente une gamme de trois modèles pour la pêche et la plaisance",
  "a1.p1": "Hyères — IERO NAVIS dévoile aujourd’hui sa nouvelle gamme de bateaux, baptisés Orion, Calipso et Poséidon. Ensemble, ils couvrent les principaux usages de l’eau, du simple bateau de pêche à la vedette de plaisance pour le grand large.",
  "a1.p2": "Orion, avec ses 4 mètres et ses 250 kg, est le point d’entrée de la gamme : un bateau dépouillé, à très faible tirant d’eau, adapté à la pêche et aux balades tranquilles. Calipso, avec ses 5,50 mètres, ajoute une cabine pour deux personnes et un solarium pour les sorties plus longues en mer, sur lac, en estuaire ou sur canal. Poséidon, avec ses 8 mètres, propose deux cabines, un poste de pilotage et la possibilité de recevoir deux moteurs puissants.",
  "a1.p3": "« Nous voulions une gamme facile à comprendre : trois bateaux, trois usages, un même niveau de qualité », explique l’équipe d’IERO NAVIS. Les bateaux sont vendus par l’intermédiaire de revendeurs, qui les équipent de moteurs ou de mâts selon les besoins de leurs clients.",
  "a2.date": "3 novembre 2025",
  "a2.h": "Moulage et finition : deux ateliers entièrement robotisés à Hyères",
  "a2.p1": "Hyères — IERO NAVIS lève le voile sur la fabrication de ses bateaux. Chaque coque passe par deux ateliers entièrement robotisés, l’un pour le moulage, l’autre pour la finition, tous deux pilotés par ordinateur.",
  "a2.p2": "Dans le premier atelier, les robots moulent les coques en plastique. Dans le second, les robots de finition ajoutent le bois et les fournitures aux coques moulées, si bien que le bateau sort de la ligne comme un produit fini. Cette organisation garantit à chaque bateau le même niveau de qualité, quel que soit le modèle produit.",
  "a2.p3": "L’entreprise peut aussi ajuster sa production d’un trimestre à l’autre, en ajoutant ou en suspendant un modèle selon la demande. Les visiteurs pourront découvrir les ateliers lors des journées portes ouvertes d’IERO NAVIS prévues à Hyères en mars 2026.",
  "a3.date": "17 novembre 2025",
  "a3.h": "IERO NAVIS exposera au Nautic – Salon nautique de Paris en décembre",
  "a3.p1": "Hyères — IERO NAVIS participera au Nautic – Salon nautique de Paris en décembre 2026, sa première présence à un grand rendez-vous national de la navigation.",
  "a3.p2": "Les visiteurs pourront découvrir Orion, Calipso et Poséidon en vrai, comparer les trois modèles et échanger avec l’équipe sur leur conception, leurs matériaux et leur finition. Les revendeurs et les professionnels sont invités à nous rencontrer pour discuter de partenariats.",
  "a3.p3": "Ce salon est la première étape d’une série d’événements qui mèneront l’entreprise de Hyères à Paris puis sur la Côte d’Azur en 2026. La liste complète est disponible sur notre page événements.",
  "a6.short": "Cybersécurité",
  "a7.short": "Dialogue avec le personnel",
  "a6.date": "1er octobre 2025",
  "a6.h": "Cybersécurité et protection des données : IERO NAVIS réagit avec fermeté et garantit la continuité totale de ses activités",
  "a6.p1": "Hyères — Fidèle à sa devise « Les bateaux d’Hyères et de demain », IERO NAVIS confirme avoir récemment détecté et neutralisé une tentative d’intrusion visant son système informatique ainsi que des dispositifs d’écoute illicites dans des espaces d’affaires partagés.",
  "a6.p2": "Dès l’identification de ces actes d’espionnage industriel, la cellule de crise a procédé au confinement préventif de ses réseaux et engagé un plan de sécurisation complet en liaison avec les autorités compétentes. L’entreprise s’en tient strictement aux faits vérifiés dans le cadre de l’enquête judiciaire en cours et se refuse à commenter toute rumeur sur l’origine de l’attaque.",
  "a6.p3": "Quatre mesures protègent nos partenaires et nos savoir-faire : une refonte de la politique interne de sécurité (pares-feux renforcés, audit forensique complet, double authentification, cloisonnement strict des données sensibles) ; la sécurisation physique des locaux à Hyères ; des suites judiciaires, avec un dépôt de plainte et la mobilisation de nos titres de propriété industrielle déposés à l’INPI ; et la continuité industrielle, avec des ateliers robotisés à 100 % de leur capacité, toutes les commandes en cours honorées dans les délais et aucune modification de nos tarifs.",
  "a7.date": "1er octobre 2026",
  "a7.h": "IERO NAVIS répond aux critiques sur les conditions de travail de son personnel administratif et ouvre le dialogue",
  "a7.p1": "Hyères — IERO NAVIS a pris connaissance de la campagne publique sur les conditions de travail du personnel administratif dans l’industrie nautique et du préavis de grève déposé par un syndicat. L’entreprise respecte le droit de grève et choisit le dialogue.",
  "a7.p2": "Les faits : le service administratif est passé de 15 à 29 salariés en un trimestre, soit presque le double ; les rémunérations des trois catégories de personnel administratif ont été relevées ; l’entreprise compte désormais 41 salariés, dont 12 représentants commerciaux. Les représentants du personnel et le syndicat sont reçus dès le lendemain, chaque salarié du service administratif aura un entretien individuel dans les 15 jours et chaque revendication recevra une réponse écrite sous 5 jours. L’entreprise propose aussi une rencontre à l’association à l’origine de la campagne.",
  "a7.p3": "Les locaux ont subi un sinistre et IERO NAVIS engage un réaménagement complet : diagnostics amiante et métaux lourds, remise en état de l’électricité et du réseau, nouveau bâtiment de bureaux, avec télétravail maintenu et matériel fourni pendant les travaux. Les commandes, les livraisons et les conditions de paiement du catalogue sont maintenues. « Nous avons presque doublé notre équipe administrative en un trimestre et relevé les rémunérations. Nous écoutons les critiques et nous préférons le dialogue à la polémique », déclare Julie Croize, direction marketing et porte-parole d’IERO NAVIS.",
  "pr.pdf": "Télécharger le document complet (PDF)",
  "a4.short": "Parité femmes-hommes",
  "a5.short": "Notre communiqué de presse",
  "a4.date": "20 novembre 2025",
  "a4.h": "Parité femmes-hommes atteinte dans l’équipe de direction d’IERO NAVIS",
  "a4.p1": "Hyères — IERO NAVIS annonce que la parité femmes-hommes est atteinte dans son équipe de direction : sur les 11 personnes qui la composent, 6 sont des femmes (55 %) et 5 sont des hommes (45 %), dans la fourchette de 40 % à 60 % retenue par la loi pour les conseils d’administration.",
  "a4.p2": "Les femmes dirigent la direction juridique, la direction financière et la direction marketing, et l’équipe financière est parfaitement équilibrée, avec deux femmes et deux hommes. L’entreprise poursuit ses efforts pour que chaque équipe soit la plus mixte possible, en particulier les équipes juridique et marketing.",
  "a4.p3": "Avec 24 salariés, IERO NAVIS n’est pas tenue de publier un index de l’égalité professionnelle. Elle a choisi de le faire volontairement, avec un plan d’action sur le recrutement, la rémunération, les promotions, l’équilibre entre vie professionnelle et personnelle et la lutte contre le sexisme et le harcèlement. La fiche parité est mise à jour chaque trimestre.",
  "a5.date": "26 novembre 2025",
  "a5.h": "IERO NAVIS annonce des mesures pour ses salariés et confirme la continuité de service à ses clients",
  "a5.p1": "Hyères — IERO NAVIS, fabricant de coques de bateaux de pêche et de plaisance installé à Hyères, a subi récemment des inondations et l’effondrement de murs de soutènement dans ses locaux. L’entreprise annonce un ensemble de mesures en faveur de ses salariés et confirme la continuité de son activité auprès de ses clients.",
  "a5.p2": "Les locaux du siège sont inaccessibles pour plusieurs mois de travaux ; les équipes administratives et commerciales travaillent à 100 % à distance et le sinistre est déclaré à l’assureur. Pour les salariés : une indemnité forfaitaire par jour télétravaillé et une compensation de la restauration, un entretien individuel sur la charge de travail avec des plages de contact définies, une cellule d’écoute et l’accès à un lieu de travail alternatif, la consultation du comité social et économique et un avenant de télétravail pour la durée des travaux. Le président-directeur général réunit l’ensemble du personnel dans les 48 heures et aucun salarié ne sera sanctionné pour avoir exprimé un désaccord.",
  "a5.p3": "Pour les clients : les commandes, les livraisons et les conditions de paiement du catalogue sont maintenues, et les clients historiques et les distributeurs sont contactés individuellement. « Nous devons à nos salariés de la clarté et des moyens de travailler dans de bonnes conditions, et à nos clients la continuité du service. Nous tiendrons ces deux engagements », déclare Bastien Coupeaux, président-directeur général d’IERO NAVIS."
 }
};

  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---- Langue EN / FR ---- */
  const LANGS = ['en','fr'];
  function currentLang(){
    const p = new URLSearchParams(location.search).get('lang');
    if (LANGS.includes(p)) return p;
    try { const s = localStorage.getItem('iero-lang'); if (LANGS.includes(s)) return s; } catch(e){}
    return 'en';
  }
  function applyLang(l){
    const d = Object.assign({}, I18N[l]);
    document.documentElement.lang = l;
    if (d.title) document.title = d.title;
    document.querySelectorAll('[data-i18n]').forEach(el => { const v = d[el.dataset.i18n]; if (v !== undefined) el.innerHTML = v; });
    document.querySelectorAll('[data-i18n-attr]').forEach(el => {
      el.dataset.i18nAttr.split(';').forEach(pair => { const [attr,key] = pair.split(':'); if (d[key] !== undefined) el.setAttribute(attr, d[key]); });
    });
    document.querySelectorAll('[data-link]').forEach(a => {
      const [page, hash] = a.dataset.link.split('#');
      a.setAttribute('href', (page || '') + '?lang=' + l + (hash ? '#' + hash : ''));
      if (!page) a.setAttribute('href', '#' + hash);
    });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
    document.dispatchEvent(new CustomEvent('langchange', {detail:l}));
  }
  function setLang(l){
    try { localStorage.setItem('iero-lang', l); } catch(e){}
    try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u); } catch(e){}
    applyLang(l);
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  applyLang(currentLang());

  /* ---- Barre de navigation ---- */
  const nav = document.getElementById('nav');
  if (nav && !nav.classList.contains('scrolled')) {
    const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > window.innerHeight * 0.6);
    addEventListener('scroll', onScroll, {passive:true}); onScroll();
  }

  /* ---- Apparition en fondu ---- */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }), {threshold:.12});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));


</script>
