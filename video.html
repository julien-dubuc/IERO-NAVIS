<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Films — IERO NAVIS</title>
<meta name="description" content="The IERO NAVIS films: our company, our story, our boats.">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ink:#111214; --ink-soft:#4a4d52; --line:#d9dbde; --paper:#ffffff; --mist:#f4f5f6; --sea:#2b3f4d;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.65;-webkit-font-smoothing:antialiased}
  img,video{display:block;max-width:100%}
  a{color:inherit}
  .wrap{width:min(1120px,100% - 48px);margin-inline:auto}

  /* Navigation */
  .nav{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(20px,4vw,56px);transition:background .4s,box-shadow .4s,padding .4s}
  .nav.scrolled{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line);padding-block:8px}
  .nav .brand img{height:44px;width:auto;opacity:0;transition:opacity .4s}
  .nav.scrolled .brand img{opacity:1}
  .nav ul{display:flex;gap:clamp(12px,2vw,30px);list-style:none}
  .nav ul a{text-decoration:none;font-size:.74rem;letter-spacing:.15em;text-transform:uppercase;position:relative;padding-block:6px;white-space:nowrap}
  .nav ul a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
  .nav ul a:hover::after,.nav ul a[aria-current="page"]::after{transform:scaleX(1)}
  .lang{display:flex;border:1px solid var(--line);background:rgba(255,255,255,.75)}
  .lang button{background:none;border:0;padding:6px 11px;font:inherit;font-size:.72rem;letter-spacing:.14em;cursor:pointer;color:var(--ink)}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* Génériques */
  section{position:relative}
  .eyebrow{font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
  h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.15}
  h2{font-size:clamp(2rem,4.4vw,3.2rem);margin-top:14px}
  .lead{max-width:640px;margin-top:22px;color:var(--ink-soft);font-size:1.06rem}
  .pad{padding-block:clamp(72px,11vw,140px)}
  .reveal{opacity:0;transform:translateY(26px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
  .reveal.in{opacity:1;transform:none}
  .btn{display:inline-block;margin-top:30px;padding:15px 34px;border:1px solid var(--ink);text-decoration:none;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;transition:background .35s,color .35s}
  .btn:hover{background:var(--ink);color:#fff}
  footer{padding:36px 0 44px;text-align:center;font-size:.76rem;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  footer img{height:48px;width:auto;margin:0 auto 14px;opacity:.85}
  footer .links{margin-bottom:14px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
  footer .links a{text-decoration:none;border-bottom:1px solid transparent}
  footer .links a:hover{border-color:currentColor}

  /* Pages secondaires */
  .page-head{padding:clamp(130px,16vw,190px) 0 clamp(40px,6vw,70px);text-align:center;background:linear-gradient(var(--mist),var(--paper))}
  .page-head h1{font-size:clamp(2.2rem,5vw,3.6rem);margin-top:14px}
  .page-head .lead{margin-inline:auto}

  .player{max-width:1000px;margin-inline:auto}
  .stage{position:relative;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.18)}
  .stage video{width:100%;aspect-ratio:16/9;background:#000;display:block}
  .stage.portrait{max-width:min(400px,86vw);margin-inline:auto}
  .stage.portrait video{aspect-ratio:9/16}
  .subs{position:absolute;left:0;right:0;bottom:13%;z-index:2;display:flex;justify-content:center;padding:0 5%;pointer-events:none}
  .subs span{max-width:900px;text-align:center;color:#fff;font-size:clamp(.85rem,2vw,1.35rem);line-height:1.4;padding:.25em .7em;background:rgba(0,0,0,.62);text-shadow:0 1px 2px rgba(0,0,0,.6);opacity:0;transition:opacity .35s}
  .subs span.on{opacity:1}
  .subs.mid{bottom:auto;top:50%;transform:translateY(-50%)}
  .subs.mid span{font-style:italic;white-space:pre-line;background:rgba(0,0,0,.5)}
  .fs{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:1.2rem;cursor:pointer;opacity:.75;transition:opacity .3s}
  .fs:hover{opacity:1}
  .stage:fullscreen{display:flex;align-items:center;justify-content:center;background:#000;max-width:none}
  .stage:fullscreen video{height:100vh;width:100%;aspect-ratio:auto;object-fit:contain}
  .stage:fullscreen .subs{bottom:10%}
  .stage:fullscreen .subs.mid{bottom:auto;top:50%}
  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .page-head.again{padding-top:clamp(40px,6vw,70px)}
  .page-head h2{font-size:clamp(2.2rem,5vw,3.6rem);margin-top:14px}

  /* Carrousel des vidéos de présentation */
  .carousel{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(8px,2vw,28px);max-width:760px;margin-inline:auto}
  .arrow{width:52px;height:52px;border:1px solid var(--ink);border-radius:50%;background:none;font-size:1.7rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding-bottom:4px;transition:background .3s,color .3s}
  .arrow:hover{background:var(--ink);color:#fff}
  .slide[hidden]{display:none}
  .slide-title{margin-top:20px;text-align:center;font-family:Georgia,serif;font-size:1.25rem}
  .dots{display:flex;gap:10px;justify-content:center;margin-top:12px;font-size:.78rem;letter-spacing:.2em;color:var(--ink-soft);align-items:center}
  .dots i{display:block;width:9px;height:9px;border-radius:50%;border:1px solid var(--ink);transition:background .3s}
  .dots i.on{background:var(--ink)}
  @media (max-width:560px){.arrow{width:40px;height:40px;font-size:1.3rem}}

  /* Courts films */
  .shorts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(16px,2.4vw,28px);margin-top:40px}
  .short .stage video{aspect-ratio:16/9}
  .short h3{margin-top:14px;font-family:Georgia,serif;font-weight:400;font-size:1.3rem;text-align:center}

  @media (max-width:980px){
    .nav{flex-wrap:wrap;justify-content:center;row-gap:6px}
    .nav .brand{display:none}
    .nav ul{flex-wrap:wrap;justify-content:center;gap:4px 14px}
    .nav ul a{font-size:.68rem;letter-spacing:.1em}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>

  <section class="pad" style="padding-top:20px">

<script>
  const I18N = {
 "en": {
  "nav.company": "Company",
  "nav.range": "Range",
  "nav.craft": "Know-how",
  "nav.events": "Events",
  "nav.press": "Press",
  "nav.gallery": "Gallery",
  "nav.film": "Film",
  "nav.mkt": "Marketing",
  "nav.pres": "Presentation",
  "nav.sav": "After-sales",
  "nav.contact": "Contact",
  "foot.rights": "All rights reserved",
  "foot.philosophy": "Philosophy &amp; values",
  "foot.home": "Home",
  "title": "Films — IERO NAVIS",
  "meta": "The IERO NAVIS films: our company, our story, our boats.",
  "v.eyebrow": "Film",
  "v0.h1": "Meet IERO NAVIS",
  "v0.lead": "Our company, our values and the people who build our boats.",
  "v.t1": "Our company, our values, our people",
  "v.t2": "The story of IERO NAVIS",
  "v.prev": "Previous video",
  "v.next": "Next video",
  "s.h": "Short films",
  "s.lead": "Poséidon, Calipso and Orion in a few seconds.",

 },
 "fr": {

 }
};

  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---- Langue EN / FR ---- */
  const LANGS = ['en','fr'];
  function currentLang(){
    const p = new URLSearchParams(location.search).get('lang');
    if (LANGS.includes(p)) return p;
    try { const s = localStorage.getItem('iero-lang'); if (LANGS.includes(s)) return s; } catch(e){}
    return 'en';
  }
  function applyLang(l){
    const d = Object.assign({}, I18N[l]);
    document.documentElement.lang = l;
    if (d.title) document.title = d.title;
    document.querySelectorAll('[data-i18n]').forEach(el => { const v = d[el.dataset.i18n]; if (v !== undefined) el.innerHTML = v; });
    document.querySelectorAll('[data-i18n-attr]').forEach(el => {
      el.dataset.i18nAttr.split(';').forEach(pair => { const [attr,key] = pair.split(':'); if (d[key] !== undefined) el.setAttribute(attr, d[key]); });
    });
    document.querySelectorAll('[data-link]').forEach(a => {
      const [page, hash] = a.dataset.link.split('#');
      a.setAttribute('href', (page || '') + '?lang=' + l + (hash ? '#' + hash : ''));
      if (!page) a.setAttribute('href', '#' + hash);
    });
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
    document.dispatchEvent(new CustomEvent('langchange', {detail:l}));
  }
  function setLang(l){
    try { localStorage.setItem('iero-lang', l); } catch(e){}
    try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u); } catch(e){}
    applyLang(l);
  }
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  applyLang(currentLang());

  /* ---- Barre de navigation ---- */
  const nav = document.getElementById('nav');
  if (nav && !nav.classList.contains('scrolled')) {
    const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > window.innerHeight * 0.6);
    addEventListener('scroll', onScroll, {passive:true}); onScroll();
  }

  /* ---- Apparition en fondu ---- */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }), {threshold:.12});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));


  /* Une seule vidéo à la fois */
  const allVideos = [...document.querySelectorAll('video')];
  allVideos.forEach(v => v.addEventListener('play', () => allVideos.forEach(o => { if (o !== v) o.pause(); })));

  /* Plein écran */
  document.querySelectorAll('.stage').forEach(st => {
    const b = st.querySelector('.fs'); if (!b) return;
    b.addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else if (st.requestFullscreen) st.requestFullscreen(); });
  });

  const slides = [...document.querySelectorAll('.slide')];
  slides.forEach((sl, i) => {
    const v = sl.querySelector('video'), cues = CUES[i] || [];
    const lines = ['.subs:not(.mid)', '.subs.mid'].map(q => { const sp = document.createElement('span'); sl.querySelector(q).appendChild(sp); return {sp, shown: -1}; });
    const tick = () => {
      const en = document.documentElement.lang === 'en', t = v.currentTime;
      lines.forEach((L, m) => {
        const k = en ? cues.findIndex(c => (c[3] ? 1 : 0) === m && t >= c[0] && t < c[1]) : -1;
        if (k !== L.shown) { L.shown = k; if (k < 0) L.sp.classList.remove('on'); else { L.sp.textContent = cues[k][2]; L.sp.classList.add('on'); } }
      });
    };
    ['timeupdate','seeked','play','pause','loadedmetadata'].forEach(ev => v.addEventListener(ev, tick));
    document.addEventListener('langchange', tick);
    (function loop(){ if (!v.paused) tick(); requestAnimationFrame(loop); })();
  });

  /* Carrousel (flèches) */
  let cur = 0;
  function show(i){
    cur = (i + slides.length) % slides.length;
    slides.forEach((sl, k) => { sl.hidden = k !== cur; if (k !== cur) sl.querySelector('video').pause(); });
    document.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === cur));
    document.getElementById('count').textContent = (cur + 1) + ' / ' + slides.length;
    const v = slides[cur].querySelector('video'); if (v.preload === 'none') v.preload = 'metadata';
  }
  document.getElementById('prev').addEventListener('click', () => show(cur - 1));
  document.getElementById('next').addEventListener('click', () => show(cur + 1));

  const film = document.getElementById('film');
  document.getElementById('playbtn').addEventListener('click', () => {
    film.scrollIntoView({behavior:'smooth', block:'center'});
    film.play().catch(() => {});
  });

</script>
